name: BigSurface Build Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Validate project
        run: |
          plutil -lint BigSurface/BigSurface.xcodeproj/project.pbxproj
          plutil -lint BigSurface/BigSurface/Info.plist

      - name: Inspect upstream dependencies
        shell: bash
        run: |
          git clone --branch dev --recurse-submodules \
            https://github.com/Xiashangning/BigSurface.git \
            /tmp/BigSurface-upstream

          echo "=== Upstream submodules ==="
          cat /tmp/BigSurface-upstream/.gitmodules

          echo "=== Submodule status ==="
          git -C /tmp/BigSurface-upstream submodule status --recursive

          echo "=== Upstream commit ==="
          git -C /tmp/BigSurface-upstream rev-parse HEAD

          echo "=== Xcode targets ==="
          xcodebuild -list -project BigSurface/BigSurface.xcodeproj


      - name: Compare battery patch with upstream
        shell: bash
        run: |
          echo "=== Project configuration differences ==="
          diff -u \
            /tmp/BigSurface-upstream/BigSurface.xcodeproj/project.pbxproj \
            BigSurface/BigSurface.xcodeproj/project.pbxproj || true

          echo "=== Info.plist differences ==="
          diff -u \
            /tmp/BigSurface-upstream/BigSurface/Info.plist \
            BigSurface/BigSurface/Info.plist || true

          echo "=== BatteryManager references in patched source ==="
          grep -Rn 'BatteryManager' BigSurface/BigSurface \
            --include='*.cpp' --include='*.hpp' \
            --include='*.h' || true

          echo "=== Battery source files ==="
          find BigSurface/BigSurface/SurfaceBattery \
            -type f | sort
