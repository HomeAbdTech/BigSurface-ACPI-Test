name: BigSurface Build Diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Xcode
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version

      - name: Validate project
        run: |
          plutil -lint BigSurface/BigSurface.xcodeproj/project.pbxproj
          plutil -lint BigSurface/BigSurface/Info.plist

      - name: Inspect upstream dependencies
        shell: bash
        run: |
          git clone --branch dev --recurse-submodules \
            https://github.com/Xiashangning/BigSurface.git \
            /tmp/BigSurface-upstream

          echo "=== Upstream submodules ==="
          cat /tmp/BigSurface-upstream/.gitmodules

          echo "=== Submodule status ==="
          git -C /tmp/BigSurface-upstream submodule status --recursive

          echo "=== Upstream commit ==="
          git -C /tmp/BigSurface-upstream rev-parse HEAD

          echo "=== Xcode targets ==="
          xcodebuild -list -project BigSurface/BigSurface.xcodeproj



      - name: Compare battery patch with upstream
        shell: bash
        run: |
          set -e

          echo "=== Upstream project locations ==="
          find /tmp/BigSurface-upstream -name project.pbxproj -o -name Info.plist | head -25

          echo "=== Compare Xcode project ==="
          upstream="/tmp/BigSurface-upstream/BigSurface/BigSurface.xcodeproj/project.pbxproj"
          patched="BigSurface/BigSurface.xcodeproj/project.pbxproj"
          test -f "$upstream"
          test -f "$patched"
          diff -u "$upstream" "$patched" || test "$?" -eq 1

          echo "=== Compare Info.plist ==="
          upstream="/tmp/BigSurface-upstream/BigSurface/BigSurface/Info.plist"
          patched="BigSurface/BigSurface/Info.plist"
          test -f "$upstream"
          test -f "$patched"
          diff -u "$upstream" "$patched" || test "$?" -eq 1

          echo "=== Battery compilation references ==="
          grep -nE 'BatteryManager.cpp|SurfaceBatteryDriver.cpp|SurfaceSMBusController.cpp|SurfaceACAdapter.cpp' \
            BigSurface/BigSurface.xcodeproj/project.pbxproj || true


  build:
    name: Experimental BigSurface Build
    runs-on: macos-14
    timeout-minutes: 30

    steps:
      - name: Checkout patched source
        uses: actions/checkout@v4

      - name: Install upstream dependencies
        shell: bash
        run: |
          git clone --branch dev --recurse-submodules \
            https://github.com/Xiashangning/BigSurface.git \
            /tmp/BigSurface-upstream
          mkdir -p Dependencies
          cp -R /tmp/BigSurface-upstream/Dependencies/. Dependencies/

          mkdir -p ../Dependencies
          cp -R /tmp/BigSurface-upstream/Dependencies/. ../Dependencies/

          cp -R /tmp/BigSurface-upstream/MacKernelSDK ./MacKernelSDK
          echo "=== MacKernelSDK ==="
          ls -la /tmp/BigSurface-upstream/MacKernelSDK
          echo "=== Kernel headers ==="
          find /tmp/BigSurface-upstream/MacKernelSDK -name IOCommandGate.h -o -name IOACPIPlatformDevice.h -o -name mach_types.h
          echo "=== Project SDK references ==="
          grep -nE 'MacKernelSDK|KERNEL_EXTENSION_HEADER_SEARCH_PATHS|KERNEL_FRAMEWORK_HEADERS|HEADER_SEARCH_PATHS' BigSurface/BigSurface.xcodeproj/project.pbxproj || true
          
      - name: Build experimental kext
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project BigSurface/BigSurface.xcodeproj \
            -scheme BigSurface \
            -configuration Release \
            -sdk macosx \
            -derivedDataPath "$RUNNER_TEMP/BigSurfaceBuild" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/bigsurface-build.log"

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BigSurface-Experimental-Build-Logs
          path: ${{ runner.temp }}/bigsurface-build.log
          if-no-files-found: warn

      - name: Upload experimental kext
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BigSurface-ACPI-EXPERIMENTAL-UNTESTED
          path: ${{ runner.temp }}/BigSurfaceBuild/Build/Products/Release/*.kext
          if-no-files-found: error
            
